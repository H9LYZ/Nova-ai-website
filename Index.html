<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI - Discord Bot</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #0d131f 0%, #05070c 100%);
        }
        
        .brand-title {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.02em;
            color: #2b3b54;
            -webkit-text-stroke: 1.5px #4a638d;
            text-shadow: 0 0 25px rgba(66, 99, 148, 0.2);
        }

        /* Subtle ambient glow behind content */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(74, 99, 141, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen text-slate-200 flex flex-col justify-between items-center p-6 relative overflow-hidden">

    <!-- Ambient background light effect -->
    <div class="ambient-glow"></div>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col items-center justify-center text-center max-w-lg mx-auto z-10 w-full my-auto">
        
        <!-- Main Title -->
        <h1 class="brand-title text-6xl sm:text-7xl font-extrabold mb-3 select-none">
            Nova AI
        </h1>

        <!-- Subtitle -->
        <p class="text-slate-400 text-sm sm:text-base font-normal mb-8 leading-relaxed max-w-sm px-2">
            A Discord Bot That Listens to You With <span class="text-slate-200 font-medium">"Hey Nova"</span> Or <span class="text-slate-200 font-medium">"Nova"</span> And Helps Answer Your Questions
        </p>

        <!-- Action Buttons Section -->
        <div class="w-full max-w-xs space-y-3.5">
            
            <!-- Primary Button: Invite Bot -->
            <a href="https://discord.com/api/oauth2/authorize?client_id=1560387335613583393&permissions=274877990912&scope=bot" 
               target="_blank" 
               rel="noopener noreferrer"
               class="w-full bg-[#373c43] hover:bg-[#434952] text-white font-semibold py-3 px-6 rounded-xl transition-all duration-200 flex items-center justify-center space-x-3 shadow-lg hover:shadow-gray-900/50 active:scale-[0.98]">
                <i class="fa-solid fa-robot text-lg"></i>
                <span>Invite Bot</span>
            </a>

            <!-- Secondary Button: Discord Server -->
            <a href="https://discord.gg/MQFPfTuDrs" 
               target="_blank" 
               rel="noopener noreferrer"
               class="w-full bg-[#161a23]/80 hover:bg-[#1e2330] text-slate-200 font-medium py-3 px-6 rounded-xl border border-slate-800/80 hover:border-slate-700 transition-all duration-200 flex items-center justify-center space-x-3 active:scale-[0.98]">
                <i class="fa-brands fa-discord text-xl"></i>
                <span>Discord Server</span>
            </a>

        </div>
    </main>

    <!-- Footer / Badge (Matching Netlify look in screenshot) -->
    <footer class="w-full text-center py-4 z-10">
        <div class="inline-flex items-center space-x-2 bg-[#0b0f17] border border-slate-800/70 px-4 py-1.5 rounded-full text-xs text-slate-400 shadow-inner">
            <svg class="w-3.5 h-3.5 text-teal-400" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
            <span>Powered by <strong class="text-slate-200 font-semibold">Netlify</strong></span>
        </div>
    </footer>

</body>
</html>
